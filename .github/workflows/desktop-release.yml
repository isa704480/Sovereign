name: Desktop release (SOVEREIGN Cowork)

# Faqat `desktop-v*` tegi push qilinganda ishlaydi, masalan:
#   git tag desktop-v0.5.0 && git push origin desktop-v0.5.0
# Teg versiyasi desktop/package.json "version" bilan bir xil bo'lishi shart.
on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write # GitHub Release yaratish va fayllarni yuklash uchun

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#desktop-v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag version ($TAG) != desktop/package.json version ($PKG)"; exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (main / preload)
        run: |
          node --check main.mjs
          node --check preload.cjs

      - name: Build renderer
        run: npx vite build

      # Imzo sertifikati hali yo'q — electron-builder imzolashni o'tkazib yuboradi.
      # Sertifikat paydo bo'lganda: CSC_LINK / CSC_KEY_PASSWORD secret'larini qo'shing.
      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish always

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-cowork-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error
